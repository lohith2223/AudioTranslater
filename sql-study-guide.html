  .gp-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .gp-bar-wrap { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; min-width: 100px; }

  @media (max-width: 700px) { .hero { padding: 48px 20px 40px; } main { padding: 24px 16px; } .top-controls { padding: 12px 16px; } .global-progress { padding: 14px 16px; } .legend { padding: 16px 20px; gap: 16px; } td, th { padding: 10px 12px; } }
</style>
</head>

const BADGE = {
  easy:   '<span class="badge badge-easy">🟢 Easy</span>',
  medium: '<span class="badge badge-medium">🟡 Medium</span>',
  hard:   '<span class="badge badge-hard">🔴 Hard</span>',
  brain:  '<span class="badge badge-brain">🧠 Expert</span>',
};
const ROW_CLASS = {easy:'row-easy',medium:'row-medium',hard:'row-hard',brain:'row-brain'};

let state = {};
function loadState() { try { state = JSON.parse(localStorage.getItem('sql_progress')||'{}'); } catch { state={}; } }
function saveState() { localStorage.setItem('sql_progress', JSON.stringify(state)); }
function getKey(si,pi) { return si+'_'+pi; }
function countDone() { return Object.values(state).filter(v=>v.checked).length; }

function updateGlobal() {
  const done = countDone();
  const pct = (done/300*100).toFixed(1);
  document.getElementById('gp-bar').style.width = pct+'%';
  document.getElementById('gp-num').textContent = done+' / 300';
  document.getElementById('global-done').textContent = done;
}

function updateSectionProgress(si) {
  const bar = document.querySelector('[data-prog="'+si+'"]');
  const txt = document.querySelector('[data-progtxt="'+si+'"]');
  if (!bar||!txt) return;
  let done = 0;
  SECTIONS[si].problems.forEach((_,pi) => { if(state[getKey(si,pi)]?.checked) done++; });
  bar.style.width = (done/10*100)+'%';
  txt.textContent = done+'/10';
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  SECTIONS.forEach((sec, si) => {
    const section = document.createElement('div');
    section.className = 'section';
    section.dataset.si = si;
    section.style.animationDelay = Math.min(si*0.04, 0.4)+'s';

    section.innerHTML = `
      <div class="section-header">
        <span class="section-num">#${sec.num}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-count">10 problems</span>
        <button class="section-toggle" data-si="${si}">▾</button>
      </div>
      <div class="progress-section">
        <div class="progress-bar-wrap"><div class="progress-bar-fill" data-prog="${si}"></div></div>
        <span class="progress-text" data-progtxt="${si}">0/10</span>
      </div>
      <div class="section-body" data-si="${si}">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th style="width:44px">#</th>
              <th>Problem</th>
              <th class="col-difficulty">Difficulty</th>
              <th class="col-status">Done</th>
              <th class="col-notes">Notes</th>
            </tr></thead>
            <tbody id="tbody-${si}"></tbody>
          </table>
        </div>
      </div>
    `;
    main.appendChild(section);

    const tbody = document.getElementById('tbody-'+si);
    sec.problems.forEach((prob, pi) => {
      const key = getKey(si,pi);
      const checked = !!(state[key]?.checked);
      const note = state[key]?.note||'';
      const tr = document.createElement('tr');
      tr.className = ROW_CLASS[prob.d] + (checked?' completed-row':'');
      tr.dataset.si=si; tr.dataset.pi=pi; tr.dataset.diff=prob.d;
      tr.dataset.text=prob.text.toLowerCase(); tr.dataset.checked=checked?'1':'0';
      tr.innerHTML = `
        <td class="col-num">${si*10+pi+1}</td>
        <td class="col-problem">${prob.text}</td>
        <td class="col-difficulty">${BADGE[prob.d]}</td>
        <td class="col-status"><div class="check-wrap"><input type="checkbox" ${checked?'checked':''} data-key="${key}" data-si="${si}" data-pi="${pi}"></div></td>
        <td class="col-notes"><input class="col-notes-inner" type="text" placeholder="Add notes..." value="${note.replace(/"/g,'&quot;')}" data-key="${key}"></td>
      `;
      tbody.appendChild(tr);
    });

    updateSectionProgress(si);
  });

  updateGlobal();

  main.addEventListener('change', e => {
    if (e.target.type!=='checkbox') return;
    const key=e.target.dataset.key, si=+e.target.dataset.si;
    if (!state[key]) state[key]={};
    state[key].checked=e.target.checked;
    const tr=e.target.closest('tr');
    tr.dataset.checked=e.target.checked?'1':'0';
    if(e.target.checked) tr.classList.add('completed-row');
    else tr.classList.remove('completed-row');
    saveState(); updateSectionProgress(si); updateGlobal();
  });

  main.addEventListener('input', e => {
    if (!e.target.classList.contains('col-notes-inner')) return;
    const key=e.target.dataset.key;
    if (!state[key]) state[key]={};
    state[key].note=e.target.value;
    saveState();
  });

  main.addEventListener('click', e => {
    const btn=e.target.closest('.section-toggle');
    if (!btn) return;
    const si=btn.dataset.si;
    const body=main.querySelector('.section-body[data-si="'+si+'"]');
    btn.classList.toggle('collapsed');
    body.classList.toggle('hidden');
  });
}

let currentFilter='all';
function applyFilters() {
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('tbody tr').forEach(tr => {
    const matchDiff = currentFilter==='all'||tr.dataset.diff===currentFilter||(currentFilter==='unsolved'&&tr.dataset.checked!=='1');
    const matchText = !q||tr.dataset.text.includes(q);
    tr.style.display=(matchDiff&&matchText)?'':'none';
  });
  document.querySelectorAll('.section').forEach(sec => {
    const rows=sec.querySelectorAll('tbody tr');
    const visible=[...rows].some(r=>r.style.display!=='none');
    sec.style.display=visible?'':'none';
  });
}

document.getElementById('search').addEventListener('input', applyFilters);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.f;
    applyFilters();
  });
});

loadState();
render();
</script>
